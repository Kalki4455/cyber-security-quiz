<!DOCTYPE html>
<html>

<head>

<title>Login</title>

<style>

body{
    background:black;
    color:#00ff88;
    font-family:Consolas;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:400px;
    background:#06111c;
    padding:30px;
    border-radius:20px;
    border:2px solid #00ff88;
    box-shadow:0px 0px 20px #00ff88;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:10px;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#00ff88;
    border:none;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#00cc66;
}

a{
    color:#00ff88;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<h1>🔐 Login</h1>

<form method="POST">

<input
type="text"
name="username"
placeholder="Username"
required
>

<input
type="password"
name="password"
placeholder="Password"
required
>

<button type="submit">
Login
</button>

</form>

<br>

<a href="/signup">
Create Account
</a>

</div>

</body>

</html>
